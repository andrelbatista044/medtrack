<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medicamentos — MedTrack</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="shell" id="app"></div><div class="modal" id="modal"><form class="modal-box" id="form"><div class="section-title"><h2 id="form-title">Novo medicamento</h2><button type="button" class="btn ghost" onclick="closeModal()">✕</button></div><div class="form-grid"><div class="field"><label>Nome</label><input id="name" required></div><div class="field"><label>Dosagem</label><input id="dosage" placeholder="Ex.: 500 mg" required></div><div class="field full"><label>Horários (separados por vírgula)</label><input id="times" placeholder="08:00, 20:00" required></div><div class="field"><label>Frequência</label><input id="frequency" value="Todos os dias"></div><div class="field"><label>Quantidade disponível</label><input id="quantity" type="number" min="0" value="0"></div><div class="field"><label>Data de início</label><input id="start_date" type="date" required></div><div class="field"><label>Data de término (opcional)</label><input id="end_date" type="date"></div><div class="field full"><label>Observações</label><textarea id="notes" rows="3"></textarea></div></div><div class="actions"><button class="btn" type="submit">Salvar medicamento</button><button class="btn ghost" type="button" onclick="closeModal()">Cancelar</button></div></form></div><script src="/js/api.js"></script><script src="/js/medications.js"></script></body></html>
